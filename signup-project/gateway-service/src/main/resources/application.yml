server:
  port: 8000

spring:
  application:
    name: gateway-service

  # Boot 4.1 Virtual Threads 활성화
  threads:
    virtual:
      enabled: true

  # Gateway MVC 라우트 설정
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service-route
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: gateway, health