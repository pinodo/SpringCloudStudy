server:
  port: 8081

spring:
  application:
    name: order-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/msa_order_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "${MYSQL_ROOT_PASSWORD}"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cloud:
    function:
      # 수신 함수 구분자: 세미콜론(;)
      # 기존 V1 함수 2개 유지 + V2 Reply 수신 함수(handleStockReply)
      definition: stockSuccess;stockFailure;handleStockReply

    stream:
      bindings:
        # === v1 (코레오그래피) 바인딩 ===
        # 주문 생성
        orderCreated-out-0:
          destination: order-created-topic
          content-type: application/json
        # 재고 차감 성공 수신
        stockSuccess-in-0:
          destination: stock-success-topic
          group: order-stock-success-group
          consumer:
            max-attempts: 3
        # 채고 차감 실패 수신
        stockFailure-in-0:
          destination: stock-failure-topic
          group: order-stock-failure-group
          consumer:
            max-attempts: 3

        # === V2 (Orchestration) 바인딩 ===
        # 1. 재고 차감 명령 발행
        deductStock-out-0:
          destination: stock-deduct-command-topic
          content-type: application/json

        # 2. 재고 차감 결과 응답 수신
        handleStockReply-in-0:
          destination: stock-reply-topic
          group: order-orchestrator-reply-group
          consumer:
            max-attempts: 3

        # 3. 재고 보상 명령 발행
        restoreStock-out-0:
          destination: stock-restore-command-topic
          content-type: application/json
        

      rabbit:
        bindings:
          # === V1 바인딩 ===
          stockSuccess-in-0:
            consumer:
              auto-bind-dlq: true
              republish-to-dlq: true
          stockFailure-in-0:
            consumer:
              auto-bind-dlq: true
              republish-to-dlq: true
          # === V2 바인딩 ===
          handleStockReply-in-0:
            consumer:
              auto-bind-dlq: true
              republish-to-dlq: true