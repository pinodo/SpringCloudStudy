server:
  port: 8000

spring:
  application:
    name: gateway-service

  # Boot 4.1 Virtual Threads 활성화 (경량 블로킹 방식으로 대규모 동시 요청 처리)
  threads:
    virtual:
      enabled: true

  # Gateway MVC 전용 라우트 설정
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: product-service-route
              uri: lb://PRODUCT-SERVICE  # Eureka 등록명 기반 로드밸런싱 포워딩
              predicates:
                - Path=/api/products/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: gateway, health