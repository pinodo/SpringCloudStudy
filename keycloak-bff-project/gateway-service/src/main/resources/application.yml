server:
  port: 8000

spring:
  application:
    name: gateway-service

  # Boot 4.1 Virtual Threads 활성화
  threads:
    virtual:
      enabled: true

  # Gateway MVC 라우트 설정
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: product-route
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/products/**
              # TokenRelay: 세션에 보관된 Access Token을 백엔드로 자동 전파
              filters:
                - TokenRelay
            - id: admin-route
              uri: lb://ADMIN-SERVICE
              predicates:
                - Path=/api/admin/**
              filters:
                - TokenRelay

  # OAuth2 Client 설정 (Keycloak과 인증 주고받기)
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: msa-client
            client-secret: Keycloak_대시보드에서_복사한_Secret
            authorization-grant-type: authorization_code
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/msa-shop

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: gateway, health